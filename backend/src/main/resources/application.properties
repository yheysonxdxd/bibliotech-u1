spring.application.name=bibliotech
server.port=8080

# H2 en memoria (no requiere instalar nada). Consola: http://localhost:8080/h2-console
spring.datasource.url=jdbc:h2:mem:bibliotech;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Carga 3 libros y 3 estudiantes de ejemplo al arrancar
bibliotech.datos-iniciales=true
